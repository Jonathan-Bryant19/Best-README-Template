<!-- The app lives in /docs, which is what GitHub Pages should be pointed at.
     When Pages is serving from the repo root instead, the whole tree is
     published and this file is what the bare URL hits — so send it on to the
     app rather than rendering the README. Harmless in the /docs configuration,
     where this file simply isn't published. -->
<meta http-equiv="refresh" content="0; url=./docs/" />
<link rel="canonical" href="./docs/" />
<script>location.replace('./docs/' + location.search + location.hash);</script>

<style>
  html { color-scheme: dark light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #12161f;
    color: #f8fafc;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 24px;
  }
  a { color: #f97316; font-size: 1.25rem; font-weight: 700; }
</style>
</head>
